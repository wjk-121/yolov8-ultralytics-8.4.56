<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLOv8 · 智能目标检测</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <nav class="navbar">
        <div class="nav-content">
            <div class="nav-brand">
                <div class="brand-icon">
                    <img src="img/logo.png" alt="Logo" class="brand-logo-img" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
                    <svg hidden width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <span class="brand-name">小狗鼻涕泡</span>
            </div>
            <div class="nav-right">
                <div class="status-badge" id="statusBadge">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="status-text" id="statusText">加载中...</span>
                </div>
                <button class="nav-btn" onclick="showModelModal()" title="切换模型">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 20V10"/>
                        <path d="M18 20V4"/>
                        <path d="M6 20v-4"/>
                    </svg>
                </button>
                <button class="nav-btn" onclick="showConfigModal()" title="设置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="main">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <!-- 当前模型 -->
            <div class="panel">
                <h3 class="panel-title">当前模型</h3>
                <div class="model-info" id="modelInfo">
                    <div class="model-name" id="modelName">加载中...</div>
                    <div class="model-desc" id="modelDesc">--</div>
                </div>
            </div>

            <!-- 检测模式 -->
            <div class="panel">
                <h3 class="panel-title">检测模式</h3>
                <div class="mode-grid">
                    <button class="mode-btn active" data-mode="image" onclick="switchMode('image')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <path d="M21 15l-5-5L5 21"/>
                        </svg>
                        <span>图片检测</span>
                    </button>
                    <button class="mode-btn" data-mode="batch" onclick="switchMode('batch')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                        </svg>
                        <span>批量检测</span>
                    </button>
                    <button class="mode-btn" data-mode="video" onclick="switchMode('video')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="23 7 16 12 23 17 23 7"/>
                            <rect x="1" y="5" width="15" height="14" rx="2"/>
                        </svg>
                        <span>视频检测</span>
                    </button>
                    <button class="mode-btn" data-mode="camera" onclick="switchMode('camera')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                        <span>摄像头</span>
                    </button>
                    <button class="mode-btn" data-mode="url" onclick="switchMode('url')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
                            <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
                        </svg>
                        <span>URL检测</span>
                    </button>
                </div>
            </div>

            <!-- 参数设置 -->
            <div class="panel">
                <h3 class="panel-title">检测参数</h3>
                <div class="param-item">
                    <label>
                        <span>置信度阈值</span>
                        <span class="param-val" id="confVal">0.25</span>
                    </label>
                    <input type="range" id="confSlider" min="0.05" max="0.95" step="0.05" value="0.25"
                           oninput="updateConf(this.value)">
                </div>
            </div>

            <!-- 历史记录 -->
            <div class="panel">
                <h3 class="panel-title">
                    检测历史
                    <button class="clear-btn" onclick="clearHistory()" title="清空历史">清空</button>
                </h3>
                <div class="history-list" id="historyList">
                    <div class="history-empty">暂无检测记录</div>
                </div>
            </div>
        </aside>

        <!-- 主区域 -->
        <div class="content">
            <!-- 上传区 -->
            <div class="upload-area" id="uploadArea">
                <div class="upload-box" id="uploadBox">
                    <div class="upload-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <h3>拖放文件到此处</h3>
                    <p id="uploadHint">或点击选择图片文件</p>
                    <div class="upload-btns">
                        <button class="btn-primary" id="selectBtn">选择文件</button>
                        <button class="btn-secondary" id="sampleBtn" onclick="loadSample()">示例图片</button>
                    </div>
                </div>
                <input type="file" id="fileInput" style="display:none">
                <!-- 文件大小警告 -->
                <div class="file-size-warning" id="fileSizeWarning" style="display:none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    <span id="fileSizeWarningText"></span>
                </div>
            </div>

            <!-- URL 输入 -->
            <div class="url-area" id="urlArea" style="display:none">
                <div class="url-input-group">
                    <input type="text" id="urlInput" placeholder="输入图片或视频 URL..." class="url-input">
                    <button class="btn-primary" onclick="detectUrl()">检测</button>
                </div>
                <div class="url-examples">
                    <span>示例:</span>
                    <button onclick="detectSample('bus')">公交车</button>
                    <button onclick="detectSample('zidane')">足球赛</button>
                </div>
            </div>

            <!-- 摄像头区 -->
            <div class="camera-area" id="cameraArea" style="display:none">
                <div class="camera-container">
                    <video id="cameraVideo" autoplay playsinline muted></video>
                    <canvas id="cameraCanvas"></canvas>
                </div>
                <div class="camera-controls">
                    <button class="btn-primary" id="cameraToggle" onclick="toggleCamera()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                        开启摄像头
                    </button>
                    <button class="btn-secondary" id="snapshotBtn" onclick="snapshotCamera()" disabled>抓拍保存</button>
                    <button class="btn-secondary" id="captureBtn" onclick="captureAndDetect()" disabled>
                        拍照检测
                    </button>
                    <select id="cameraSelect" class="camera-select">
                        <option value="">选择摄像头...</option>
                    </select>
                    <div class="camera-stats">
                        <span id="cameraFps">-- FPS</span>
                        <span id="cameraDets">0 目标</span>
                        <span id="cameraSnaps" class="camera-snap-count" style="display:none">0 抓拍</span>
                    </div>
                </div>
            </div>

            <!-- 视频进度 -->
            <div class="progress-wrap" id="progressWrap" style="display:none">
                <div class="progress-bar-outer">
                    <div class="progress-bar-inner" id="progressBar" style="width:0%"></div>
                </div>
                <div class="progress-info">
                    <span id="progressText">准备中...</span>
                    <span id="progressPct">0%</span>
                </div>
                <div class="progress-live" id="progressLive"></div>
            </div>

            <!-- 结果展示 -->
            <div class="result-area" id="resultArea" style="display:none">
                <div class="result-header">
                    <h3>检测结果</h3>
                    <button class="btn-icon" onclick="resetAll()" title="重新开始">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12a9 9 0 019-9 9.75 9.75 0 016.74 2.74L21 8"/>
                            <path d="M21 3v5h-5"/>
                            <path d="M21 12a9 9 0 01-9 9 9.75 9.75 0 01-6.74-2.74L3 16"/>
                            <path d="M3 21v-5h5"/>
                        </svg>
                    </button>
                </div>
                <div class="result-image-wrap" id="imageBox">
                    <img id="resultImage" src="" alt="" style="display:none">
                </div>
            </div>

            <!-- 统计卡片 -->
            <div class="stats-row" id="statsRow" style="display:none">
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
                        </svg>
                    </div>
                    <div>
                        <div class="stat-value" id="statDets">0</div>
                        <div class="stat-label">检测目标</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <div>
                        <div class="stat-value" id="statTime">0s</div>
                        <div class="stat-label">处理耗时</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                        </svg>
                    </div>
                    <div>
                        <div class="stat-value" id="statFps">0</div>
                        <div class="stat-label">FPS</div>
                    </div>
                </div>
            </div>

            <!-- 检测详情表格 -->
            <div class="detail-table" id="detailTable" style="display:none">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>类别</th>
                            <th>置信度</th>
                            <th>位置</th>
                        </tr>
                    </thead>
                    <tbody id="detailBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- 模型选择弹窗 -->
    <div class="modal-overlay" id="modelModal">
        <div class="modal">
            <div class="modal-head">
                <h2>选择模型</h2>
                <button class="modal-close" onclick="closeModelModal()">&times;</button>
            </div>
            <div class="modal-stats">
                <div><span class="num" id="localCnt">0</span><span class="txt">已下载</span></div>
                <div><span class="num" id="remoteCnt">0</span><span class="txt">需下载</span></div>
            </div>
            <div class="modal-search">
                <input type="text" id="modelSearch" placeholder="搜索模型..." oninput="filterModels(this.value)">
            </div>
            <div class="modal-body">
                <div id="modelList"></div>
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="configModal">
        <div class="modal modal-sm">
            <div class="modal-head">
                <h2>参数设置</h2>
                <button class="modal-close" onclick="closeConfigModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="config-item">
                    <label>置信度阈值</label>
                    <p class="config-hint">值越高结果越精确，但可能漏检</p>
                    <input type="number" id="cfgConf" min="0.05" max="0.95" step="0.05">
                </div>
            </div>
            <div class="modal-foot">
                <button class="btn-secondary" onclick="resetConfig()">恢复默认</button>
                <button class="btn-primary" onclick="saveConfig()">保存</button>
            </div>
        </div>
    </div>

    <!-- 统一模糊遮罩加载 -->
    <div class="loading" id="loading">
        <div class="loading-spinner" id="loadingSpinner"></div>
        <p id="loadingText">处理中...</p>
        <p id="loadingWarning" class="loading-warning" style="display:none"></p>
        <div class="loading-progress-wrap" id="loadingProgressWrap" style="display:none">
            <div class="loading-progress-bar-outer">
                <div class="loading-progress-bar-inner" id="loadingProgressBar"></div>
            </div>
            <div class="loading-progress-info">
                <span id="loadingProgressStatus"></span>
                <span id="loadingProgressPct">0%</span>
            </div>
            <div class="loading-progress-live" id="loadingProgressLive"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-wrap" id="toastWrap"></div>

    <script src="js/common.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
